[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bl-halo-mcp"
version = "0.3.0"
description = "Fleet MCP wrapper for Brilliant Labs Halo (and Frame) AI glasses - BLE, Lua VM, display, camera, IMU, audio, Noa Miniapps"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sandra Schipal"}]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "brilliant-sdk>=0.4.0",
    "brilliant-ble>=0.4.0",
    "brilliant-msg>=0.4.0",
    "bleak>=0.22.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.16.0,<0.17", "pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pyright>=1.1.0"]

[project.scripts]
bl-halo-mcp = "bl_halo_mcp.run_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
